<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%E2%9A%A1%3C/text%3E%3C/svg%3E">
    <script src="/js/i18n.js"></script>
  <script src="/js/i18n-en.js"></script>
  <script src="/js/i18n-es.js"></script>
  <title>Entrar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #07090d; --panel: #10141c; --line: #232a36; --text: #eef1f6; --muted: #8b95a7; --accent: #10b981; --err: #f87171; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(1200px 600px at 20% -10%, #10b98122, transparent), var(--bg);
      color: var(--text); font-family: Inter, system-ui, sans-serif; padding: 16px; }
    .card { width: 100%; max-width: 380px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 32px 28px; box-shadow: 0 30px 80px #0008; }
    .logo { font-weight: 800; font-size: 20px; letter-spacing: .5px; margin-bottom: 4px; }
    .logo { display: flex; align-items: center; gap: 8px; }
    p.sub { color: var(--muted); margin: 0 0 24px; font-size: 14px; }
    label { display: block; font-size: 12px; color: var(--muted); margin: 14px 0 6px; font-weight: 600; letter-spacing: .3px; }
    input { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: #0a0d13; color: var(--text); font: inherit; font-size: 15px; }
    input:focus { outline: none; border-color: var(--accent); }
    button { width: 100%; margin-top: 22px; padding: 12px; border: 0; border-radius: 10px; background: var(--accent); color: #022c1e; font: inherit; font-weight: 700; font-size: 15px; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    .ms { display: none; align-items: center; justify-content: center; gap: 10px; width: 100%; margin-top: 18px; padding: 11px; background: #0a0d13; color: var(--text);
      border: 1px solid var(--line); border-radius: 10px; font-weight: 600; font-size: 14px; text-decoration: none; }
    .ms:hover { border-color: var(--accent); }
    .ms svg { flex: 0 0 auto; }
    .or { display: none; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; margin-top: 18px; }
    .or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
    body.has-ms .ms, body.has-ms .or { display: flex; }
    body.pixel .ms { border-radius: 0; border-width: 2px; }
    .err { color: var(--err); font-size: 13px; min-height: 18px; margin-top: 12px; }
    body.pixel .card { border-radius: 0; border-width: 2px; box-shadow: 8px 8px 0 #0009; }
    body.pixel input { border-radius: 0; border-width: 2px; box-shadow: inset 2px 2px 0 #0008; }
    body.pixel button { border-radius: 0; box-shadow: 0 -3px 0 0 #0006, 0 3px 0 0 #0006, -3px 0 0 0 #0006, 3px 0 0 0 #0006, inset 0 -3px 0 #0005; }
    body.pixel button:active { transform: translateY(2px); }
    .lang { margin-top: 14px; width: 100%; background: transparent; color: var(--muted, #8a93a6); border: 1px solid rgba(255,255,255,.12); padding: 6px 8px; font: inherit; font-size: .8rem; }
  </style>
</head>
<body class="pixel">
  <form class="card" id="form">
    <div class="logo"><span style="color:var(--accent);display:inline-flex"><svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor" shape-rendering="crispEdges"><path d="M14 4h4v2h-4zm-4-2h4v2h-4zM6 8h4v2H6zm0 10h4v2H6zm4-8h4v2h-4zm0 10h4v2h-4zm4-12h4v2h-4zm0 10h4v2h-4zM6 4h4v2H6zM2 6h4v2H2zm0 10h4v2H2zM18 6h4v2h-4zm0 10h4v2h-4z"/> <path d="M2 6h2v12H2zm18 0h2v12h-2zm-8 6h2v8h-2z"/></svg></span> <span id="appName">Studio</span></div>
    <p class="sub">Entre para abrir o seu estúdio.</p>
    <a class="ms" id="msBtn" href="/api/auth/microsoft/start"><svg width="18" height="18" viewBox="0 0 21 21" aria-hidden="true"><rect x="1" y="1" width="9" height="9" fill="#f25022"/><rect x="11" y="1" width="9" height="9" fill="#7fba00"/><rect x="1" y="11" width="9" height="9" fill="#00a4ef"/><rect x="11" y="11" width="9" height="9" fill="#ffb900"/></svg><span id="msLabel">Entrar com Microsoft</span></a>
    <div class="or">ou com e-mail e senha</div>
    <label for="email">E-mail</label>
    <input id="email" type="email" autocomplete="username" required autofocus>
    <label for="password">Senha</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button type="submit" id="btn">Entrar</button>
    <div class="err" id="err"></div>
    <select id="lang" class="lang" data-noi18n aria-label="Language"></select>
  </form>
  <script src="/js/login.js"></script>
</body>
</html>
