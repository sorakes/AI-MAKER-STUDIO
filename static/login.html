<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%E2%9A%A1%3C/text%3E%3C/svg%3E">
    <script src="/js/i18n.js"></script>
  <script src="/js/styles.js"></script>
  <script src="/js/i18n-en.js"></script>
  <script src="/js/i18n-es.js"></script>
  <title>Entrar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/login.css">
</head>
<body class="pixel">
  <form class="card" id="form">
    <div class="logo"><span data-st="color:var(--accent);display:inline-flex"><svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor" shape-rendering="crispEdges"><path d="M14 4h4v2h-4zm-4-2h4v2h-4zM6 8h4v2H6zm0 10h4v2H6zm4-8h4v2h-4zm0 10h4v2h-4zm4-12h4v2h-4zm0 10h4v2h-4zM6 4h4v2H6zM2 6h4v2H2zm0 10h4v2H2zM18 6h4v2h-4zm0 10h4v2h-4z"/> <path d="M2 6h2v12H2zm18 0h2v12h-2zm-8 6h2v8h-2z"/></svg></span> <span id="appName">Studio</span></div>
    <p class="sub">Entre para abrir o seu estúdio.</p>
    <a class="ms" id="msBtn" href="/api/auth/microsoft/start"><svg width="18" height="18" viewBox="0 0 21 21" aria-hidden="true"><rect x="1" y="1" width="9" height="9" fill="#f25022"/><rect x="11" y="1" width="9" height="9" fill="#7fba00"/><rect x="1" y="11" width="9" height="9" fill="#00a4ef"/><rect x="11" y="11" width="9" height="9" fill="#ffb900"/></svg><span id="msLabel">Entrar com Microsoft</span></a>
    <div class="or">ou com e-mail e senha</div>
    <label for="email">E-mail</label>
    <input id="email" type="email" autocomplete="username" required autofocus>
    <label for="password">Senha</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button type="submit" id="btn">Entrar</button>
    <div class="err" id="err" role="alert" aria-live="assertive"></div>
    <select id="lang" class="lang" data-noi18n aria-label="Language"></select>
  </form>
  <script src="/js/login.js"></script>
</body>
</html>
